<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | FreshHarvest</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/signup.css">
</head>
<body class="auth-page signup-page">
  <a href="index.html" class="back-home" aria-label="Back to home">← Home</a>
  <div class="auth-bg">
    <span class="float-fruit">🛒</span>
    <span class="float-fruit">🌿</span>
    <span class="float-fruit">🍎</span>
    <span class="float-fruit">🥦</span>
  </div>
  <button class="theme-toggle auth-theme" aria-label="Toggle theme">🌙</button>

  <div class="auth-container signup-container">
    <a href="index.html" class="auth-logo">🌿 Stackly Store</a>
    <div class="signup-card glass-card reveal">
      <h1>Create Account</h1>
      <p class="auth-subtitle">Join FreshHarvest — Get 40% off first order!</p>
      <form id="signupForm" class="auth-form">
        <div class="form-group"><label>Full Name</label><input type="text" required placeholder="John Doe"></div>
        <div class="form-group"><label>Email</label><input type="email" required placeholder="you@email.com"></div>
        <div class="form-group"><label>Phone</label><input type="tel" required placeholder="+91 9876543210"></div>
        <div class="form-group"><label>Password</label><input type="password" required minlength="6" placeholder="Min 6 characters"></div>
        <div class="form-group"><label>Confirm Password</label><input type="password" id="confirmPass" required placeholder="Repeat password"></div>
        <label class="terms"><input type="checkbox" required> I agree to Terms & Privacy Policy</label>
        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script src="js/common.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
